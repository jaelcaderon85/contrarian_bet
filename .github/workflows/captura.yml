name: captura-zcode

# Lo dispara cron-job.org cada 5 minutos (repository_dispatch, event_type "captura").
# Tambien se puede lanzar a mano desde la pestana Actions -> "Run workflow".
on:
  repository_dispatch:
    types: [captura]
  workflow_dispatch:
    inputs:
      modo:
        description: "captura = normal | test = mensaje de prueba | resumen = envia ya el resumen de manana"
        type: choice
        default: captura
        options: [captura, test, resumen]

# Nunca dos corridas a la vez (evita alertas duplicadas)
concurrency:
  group: captura-zcode
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  captura:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Estado minimo para no repetir alertas (no es un historico)
      - name: Restaurar estado
        uses: actions/cache/restore@v4
        with:
          path: estado
          key: estado-${{ github.run_id }}
          restore-keys: estado-

      - name: Ejecutar captura y alertas
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          ESTADO_DIR: estado
          GUARDAR_CSV: "0"
          RESUMEN_VENTANA_MIN: "12"
          MODO: ${{ inputs.modo || 'captura' }}
        run: python captura_v2.py "$MODO"

      - name: Guardar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: estado
          key: estado-${{ github.run_id }}

